media:
  input: public/media
  output: /ai-atlas/media
content:
  - name: directory
    label: AI 信息
    type: collection
    path: src/data/directory
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, category, recordedAt, featured, draft]
      sort: recordedAt
      order: desc
    fields:
      - name: title
        label: 名称 / 标题
        type: string
        required: true
      - name: description
        label: 一句话简介
        type: text
        required: true
      - name: category
        label: 分类
        type: select
        required: true
        options:
          values:
            - name: model
              label: 模型
            - name: tool
              label: 工具
            - name: project
              label: 开源项目
            - name: news
              label: 资讯
            - name: thought
              label: 想法 / 灵感
            - name: note
              label: 学习 / 实践笔记
      - name: link
        label: 官网 / GitHub / 原文链接
        type: string
        description: 请使用 http:// 或 https:// 开头的完整地址。
      - name: source
        label: 来源名称
        type: string
        description: 例如官方文档、GitHub、Hugging Face 博客。
      - name: recordedAt
        label: 收录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: eventDate
        label: 事件 / 发布日期（可选）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
          time: false
      - name: tags
        label: 标签
        type: string
        list: true
        description: 可自由添加；建议使用 agent、coding、local、open-source、research，或自己的中文标签。
      - name: pricing
        label: 费用说明（可选）
        type: string
        description: 例如免费、开源、按量付费；请自行核对官网。
      - name: note
        label: 我的评价（可选）
        type: text
      - name: image
        label: 封面图（可选）
        type: image
      - name: status
        label: 当前状态（可自由填写）
        type: string
        description: 例如待研究、正在体验、持续关注、已归档。
      - name: attributes
        label: 自定义属性
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: 自由添加“属性名 + 内容”，例如作者、版本、适用场景、我的评分。
        fields:
          - name: name
            label: 属性名称
            type: string
            required: true
          - name: value
            label: 属性内容
            type: text
      - name: timeline
        label: 发展历程 / 时间线
        type: object
        list:
          collapsible:
            summary: "{fields.date} · {fields.title}"
        description: 每件事添加一个节点；网站按日期从新到旧展示。这里填写真实事件日期。
        fields:
          - name: date
            label: 事件日期
            type: date
            default: ""
            required: true
            options:
              format: yyyy-MM-dd
              time: false
          - name: title
            label: 节点标题
            type: string
            required: true
          - name: description
            label: 发生了什么 / 我的看法
            type: text
          - name: link
            label: 来源链接（可选）
            type: string
      - name: thoughts
        label: 想法 / 灵感 / 使用记录
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 随时加一条。类型可自由填写，前台按你的排列顺序显示。
        fields:
          - name: title
            label: 小标题
            type: string
            required: true
          - name: kind
            label: 记录类型
            type: string
            description: 例如灵感、实践、踩坑、问题、摘录、复盘。
          - name: date
            label: 记录日期（可选）
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
              time: false
          - name: content
            label: 内容
            type: text
      - name: strengths
        label: 优点 / 值得借鉴
        type: text
        list: true
      - name: limitations
        label: 局限 / 待验证
        type: text
        list: true
      - name: tasks
        label: 下一步 / 待办
        type: object
        list: true
        description: 在后台勾选完成，网站展示进度。
        fields:
          - name: title
            label: 计划做什么
            type: string
            required: true
          - name: done
            label: 已完成
            type: boolean
            default: false
      - name: links
        label: 相关资料 / 参考链接
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: 链接名称
            type: string
            required: true
          - name: url
            label: 完整网址（http / https）
            type: string
            required: true
          - name: description
            label: 为什么收藏 / 备注
            type: text
      - name: sections
        label: 自定义栏目（自由加标题和内容）
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 可用于对比、路线图、问题清单、提示词等，按列表顺序展示。需要图片、表格、代码时使用下方详细笔记。
        fields:
          - name: title
            label: 栏目标题
            type: string
            required: true
          - name: content
            label: 自由内容（保留换行）
            type: text
      - name: featured
        label: 推荐
        type: boolean
        default: false
      - name: draft
        label: 草稿（从网站隐藏，但公开仓库仍可查看）
        type: boolean
        default: true
      - name: body
        label: 自由长文（支持图片、表格、代码）
        type: rich-text
  - name: guide
    label: 使用指南
    type: file
    path: src/data/pages/guide.md
    fields:
      - name: title
        label: 标题
        type: string
      - name: description
        label: 简介
        type: text
      - name: body
        label: 内容
        type: rich-text
