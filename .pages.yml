media:
  input: public/media
  output: /ai-atlas/media
content:
  - name: directory
    label: AI 信息
    type: collection
    path: src/data/directory
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      fields: [title, category, recordedAt, featured, draft]
      sort: recordedAt
      order: desc
    fields:
      - name: title
        label: 名称 / 标题
        type: string
        required: true
      - name: description
        label: 一句话简介
        type: text
        required: true
      - name: category
        label: 分类
        type: select
        required: true
        options:
          values:
            - name: model
              label: 模型
            - name: tool
              label: 工具
            - name: project
              label: 开源项目
            - name: news
              label: 技术动态
            - name: thought
              label: 想法 / 灵感
            - name: note
              label: 学习 / 实践笔记
      - name: link
        label: 官网 / GitHub / 原文链接
        type: string
        description: 请使用 http:// 或 https:// 开头的完整地址。
      - name: source
        label: 来源名称
        type: string
        description: 例如官方文档、GitHub、Hugging Face 博客。
      - name: recordedAt
        label: 收录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false
      - name: eventDate
        label: 事件 / 发布日期（可选）
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
          time: false
      - name: projectId
        label: 关联项目（版本动态填写）
        type: string
        description: 填写已公开项目档案的英文文件名，不含 .md，例如 vllm。
      - name: version
        label: 版本或发布名称（版本动态填写）
        type: string
        description: 例如 v0.34.0。版本动态同时填写关联项目、事件日期与官方原文链接。
      - name: topics
        label: 站点主题（可多选）
        type: select
        description: 供时间线与资料库筛选。留空时网站会按分类及标签归类。
        options:
          multiple: true
          values:
            - { name: models, label: 模型架构与发布 }
            - { name: coding, label: AI 编程、Agent 与 MCP }
            - { name: deployment, label: 推理与部署 }
            - { name: rag, label: RAG 与数据工程 }
            - { name: training, label: 训练与微调 }
            - { name: multimodal, label: 多模态与机器人 }
            - { name: research, label: 研究与评测 }
            - { name: governance, label: 安全与可靠性 }
            - { name: industry, label: 硬件与算力 }
            - { name: products, label: 开发工具与应用 }
      - name: availability
        label: 发布或跟踪状态
        type: select
        options:
          values:
            - { name: released, label: 已发布 }
            - { name: preview, label: 预览 }
            - { name: announced, label: 已宣布 }
            - { name: restricted, label: 受限开放 }
            - { name: tracked, label: 持续跟踪 }
            - { name: retired, label: 已停用 }
      - name: verifiedAt
        label: 最后核对日期
        description: 核对过链接、可用范围或后续进展后填写。
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
          time: false
      - name: openness
        label: 开放方式
        type: select
        options:
          values:
            - { name: source, label: 代码开源 }
            - { name: weights, label: 开放权重 }
            - { name: hosted, label: 托管使用 }
      - name: access
        label: 使用入口与要求
        type: string
        description: 例如 API、浏览器、GitHub、访问地区或最低系统要求。
      - name: takeaway
        label: 为什么重要
        type: text
        description: 一两句即可。入选「本期重点」时会优先显示这一栏。
      - name: related
        label: 相关条目
        type: reference
        options:
          collection: directory
          multiple: true
          value: "{path}"
          label: "{primary}"
      - name: tags
        label: 标签
        type: string
        list: true
        description: 可自由添加；建议使用 agent、coding、local、open-source、research，或自己的中文标签。
      - name: pricing
        label: 费用说明（可选）
        type: string
        description: 例如免费、开源、按量付费；请自行核对官网。
      - name: note
        label: 我的评价（可选）
        type: text
      - name: image
        label: 封面图（可选）
        type: image
      - name: status
        label: 当前状态（可自由填写）
        type: string
        description: 例如待研究、正在体验、持续关注、已归档。
      - name: attributes
        label: 自定义属性
        type: object
        list:
          collapsible:
            summary: "{fields.name}"
        description: 自由添加“属性名 + 内容”，例如作者、版本、适用场景、我的评分。
        fields:
          - name: name
            label: 属性名称
            type: string
            required: true
          - name: value
            label: 属性内容
            type: text
      - name: timeline
        label: 发展历程 / 时间线
        type: object
        list:
          collapsible:
            summary: "{fields.date} · {fields.title}"
        description: 每件事添加一个节点；网站按日期从新到旧展示。这里填写真实事件日期。
        fields:
          - name: date
            label: 事件日期
            type: date
            default: ""
            required: true
            options:
              format: yyyy-MM-dd
              time: false
          - name: title
            label: 节点标题
            type: string
            required: true
          - name: description
            label: 发生了什么 / 我的看法
            type: text
          - name: link
            label: 来源链接（可选）
            type: string
      - name: thoughts
        label: 想法 / 灵感 / 使用记录
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 随时加一条。类型可自由填写，前台按你的排列顺序显示。
        fields:
          - name: title
            label: 小标题
            type: string
            required: true
          - name: kind
            label: 记录类型
            type: string
            description: 例如灵感、实践、踩坑、问题、摘录、复盘。
          - name: date
            label: 记录日期（可选）
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
              time: false
          - name: content
            label: 内容
            type: text
      - name: strengths
        label: 优点 / 值得借鉴
        type: text
        list: true
      - name: limitations
        label: 局限 / 待验证
        type: text
        list: true
      - name: tasks
        label: 下一步 / 待办
        type: object
        list: true
        description: 在后台勾选完成，网站展示进度。
        fields:
          - name: title
            label: 计划做什么
            type: string
            required: true
          - name: done
            label: 已完成
            type: boolean
            default: false
      - name: links
        label: 相关资料 / 参考链接
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - name: title
            label: 链接名称
            type: string
            required: true
          - name: url
            label: 完整网址（http / https）
            type: string
            required: true
          - name: description
            label: 为什么收藏 / 备注
            type: text
      - name: sections
        label: 自定义栏目（自由加标题和内容）
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        description: 可用于对比、路线图、问题清单、提示词等，按列表顺序展示。需要图片、表格、代码时使用下方详细笔记。
        fields:
          - name: title
            label: 栏目标题
            type: string
            required: true
          - name: content
            label: 自由内容（保留换行）
            type: text
      - name: featured
        label: 推荐
        type: boolean
        default: false
      - name: draft
        label: 草稿（从网站隐藏，但公开仓库仍可查看）
        type: boolean
        default: true
      - name: body
        label: 自由长文（支持图片、表格、代码）
        type: rich-text
  - name: guide
    label: 使用指南
    type: file
    path: src/data/pages/guide.md
    fields:
      - name: title
        label: 标题
        type: string
      - name: description
        label: 简介
        type: text
      - name: body
        label: 内容
        type: rich-text
